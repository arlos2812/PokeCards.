<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PokeCards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 class="logo">PokeCards</h1>
  </header>

  <!-- MÚSICA -->
  <div class="music-bar">
    <button id="music-toggle">▶ Música</button>
    <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.4">
  </div>

  <!-- LOADING -->
  <div id="loading" class="loading">Cargando expansiones…</div>

  <!-- EXPANSIONES -->
  <section id="sets-screen">
    <h2 class="section-title">EXPANSIONES</h2>
    <div id="sets" class="grid"></div>
  </section>

  <!-- CARTAS -->
  <section id="cards-screen" class="hidden">
    <button id="back-to-sets">⬅ Volver</button>
    <h2 id="set-title" class="section-title"></h2>
    <div id="cards" class="grid"></div>
    <button id="load-more">Cargar más</button>
  </section>

  <!-- AUDIO (3 canciones) -->
  <audio id="music-player"></audio>

  <script src="app.js"></script>
</body>
</html>
